name: Test Package Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    name: Test package build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gdal-bin \
          libgdal-dev \
          libproj-dev \
          proj-data \
          proj-bin \
          libgeos-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine pytest
        # Set GDAL version for proper installation
        export GDAL_VERSION=$(gdal-config --version)
        echo "GDAL version: $GDAL_VERSION"
        # Install the package with its dependencies
        python -m pip install -e .

    - name: Install dev dependencies
      run: |
        python -m pip install -e .[dev]

    - name: Lint with flake8
      run: |
        # Install flake8 if not in dev dependencies
        python -m pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        # Run tests if any exist
        if [ -d "tests" ] || find . -name "*test*.py" -not -path "./.venv/*" | grep -q .; then
          python -m pytest -v
        else
          echo "No tests found, skipping test execution"
        fi

    - name: Build package
      run: python -m build

    - name: Check package
      run: python -m twine check dist/*

    - name: Test installation
      run: |
        # Build and check the package without installing heavy dependencies
        python -m build
        python -m twine check dist/*
        # Test basic import without heavy dependencies
        echo "Testing basic package structure..."
        python -c "
        import sys
        from pathlib import Path
        sys.path.insert(0, 'src')
        
        # Basic package structure test
        try:
            import orthophotos_downloader
            print('✅ Package structure is valid')
        except ImportError as e:
            if 'rasterio' in str(e) or 'geopandas' in str(e):
                print('⚠️  Heavy dependencies not available (expected in CI)')
            else:
                print(f'❌ Unexpected import error: {e}')
                sys.exit(1)
        "
