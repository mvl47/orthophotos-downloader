name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v0.1.0, etc.

jobs:
  build-and-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment: release  # Use a GitHub environment for additional protection
    permissions:
      id-token: write  # Required for trusted publishing to PyPI

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
        # Install tomli for Python < 3.11 compatibility
        python -m pip install tomli

    - name: Verify version matches tag
      run: |
        # Extract version from tag (remove 'v' prefix)
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Tag version: $TAG_VERSION"
        
        # Extract version from pyproject.toml (Python version independent)
        python -c "
        import sys
        try:
            import tomllib
        except ImportError:
            import tomli as tomllib
        
        with open('pyproject.toml', 'rb') as f:
            config = tomllib.load(f)
        
        version = config['project']['version']
        print(f'pyproject.toml version: {version}')
        
        tag_version = '$TAG_VERSION'
        if tag_version != version:
            print(f'ERROR: Tag version ({tag_version}) does not match pyproject.toml version ({version})')
            sys.exit(1)
        print('Version verification passed')
        "

    - name: Build package
      run: python -m build

    - name: Check package
      run: python -m twine check dist/*

    - name: Debug information
      run: |
        echo "🔍 Debug Information:"
        echo "GitHub ref: ${{ github.ref }}"
        echo "Is RC tag: ${{ contains(github.ref, 'rc') }}"
        echo "Starts with v: ${{ startsWith(github.ref, 'refs/tags/v') }}"
        echo "Package contents:"
        ls -la dist/
        echo "Package metadata:"
        python -m twine check dist/* --strict

    - name: Publish to Test PyPI (optional, for testing)
      if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'rc')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
        print-hash: true
        attestations: true

    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Changes in this Release
          
          Please check the CHANGELOG or commit history for detailed changes.
          
          ## Installation
          
          ```bash
          pip install orthophotos-downloader-mvl47==${{ github.ref_name }}
          ```
        draft: false
        prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
