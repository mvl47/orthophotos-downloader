[build-system]
requires = ["hatchling >= 1.24.2"]
build-backend = "hatchling.build"

[project]
name = "orthophotos-downloader-mvl47"
version = "0.1.0rc6"
authors = [
    {name = "Daniel Godin", email = "contact@dangodin.com"},
    {name = "Joachim Ferstl", email = "jferstl@ffe.de"},
]
maintainers = [
    {name = "Daniel Godin", email = "contact@dangodin.com"},
    {name = "Joachim Ferstl", email = "jferstl@ffe.de"},
]

description = "Python wrapper for various available WMS services to simplify the download of orthophotos. Currently focused on Germany."
keywords = [
    "orthophotos", 
    "wms", 
    "germany", 
    "aerial-imagery", 
    "gis", 
    "remote-sensing", 
    "geospatial",
    "download",
    "raster"
]
readme = "README.md"
license = {text = "Apache-2.0"}

requires-python = ">=3.10"

dependencies = [
    "geopandas==0.14.4",
    "imageio==2.34.0",
    "matplotlib==3.8.4",
    "OWSLib==0.30.0",
    "rasterio==1.3.10",
    "requests==2.31.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11", 
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/ffe-munich/orthophotos-downloader"
Repository = "https://github.com/ffe-munich/orthophotos-downloader"
Documentation = "https://github.com/ffe-munich/orthophotos-downloader"
"Bug Tracker" = "https://github.com/ffe-munich/orthophotos-downloader/issues"
Changelog = "https://github.com/ffe-munich/orthophotos-downloader/releases"

[project.optional-dependencies]
dev = [
    "black",
    "flake8", 
    "pytest",
    "build",
    "twine"
]

[tool.hatch.build.targets.wheel]
packages = ["src/orthophotos_downloader"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml"
]
